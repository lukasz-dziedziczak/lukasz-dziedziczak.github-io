title: "Łukasz Dziedziczak — Software, Systems & Games"
description: "Adelaide-based software developer working across technical systems, interactive media, and independent game development."
url: "https://lukasz.website"
baseurl: ""
lang: en-AU
timezone: Australia/Adelaide

markdown: kramdown
permalink: pretty

plugins:
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - tmp
